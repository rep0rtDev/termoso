name: Dependency graph

# Gradle has no lockfile in this repo, so Dependabot only sees the direct
# dependencies declared in build.gradle.kts / libs.versions.toml. This resolves
# every configuration of the Android build and submits the full transitive
# graph to GitHub, so Dependabot alerts cover transitive Gradle dependencies
# the same way Cargo.lock / package-lock.json already do for Rust and npm.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - .github/workflows/dependency-graph.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradle:
    name: gradle (android) → dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: apps/android
