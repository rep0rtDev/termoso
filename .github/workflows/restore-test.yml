# Weekly restore drill on synthetic data: real pg_dump → pg_restore through
# `termoso-server backup/restore` against PostgreSQL 18, plus the manifest
# checks. The same test runs in ci.yml on every push; this run exists so a
# dormant repository still notices a broken restore path.
name: restore drill
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: termoso
          POSTGRES_PASSWORD: termoso
          POSTGRES_DB: termoso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U termoso -d termoso"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TERMOSO_TEST_DATABASE_URL: postgres://termoso:termoso@localhost:5432/termoso
      TERMOSO_TEST_REDIS_URL: redis://127.0.0.1:6379
      TERMOSO_TEST_REQUIRE_SERVICES: "1"
      TERMOSO_TEST_PG_DUMP: "1"
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18 libudev-dev
          pg_dump --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p termoso-server --locked --test backup --test jobs -- --nocapture
