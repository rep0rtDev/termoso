[package]
name = "termoso-server"
description = "Termoso backend: zero-knowledge sync, auth, teams and vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "termoso-server"

[[bin]]
name = "termoso-server"
path = "src/main.rs"

[dependencies]
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true, features = ["openapi"] }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

sqlx = { workspace = true }
redis = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

argon2 = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
webauthn-rs = { workspace = true }
totp-rs = { workspace = true }
openidconnect = { workspace = true }
oauth2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hex = "0.4"
# Avatars: decode whatever the browser/phone sends, store a tiny lossy WebP.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = { version = "0.3", default-features = false }

uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figment = { workspace = true }
lettre = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
url = { workspace = true }
http = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
# Mock OIDC provider in the integration tests signs RS256 ID tokens.
rsa = { version = "0.9", features = ["sha2"] }
# Software CTAP2 authenticator drives the WebAuthn ceremonies end to end.
termoso-core = { workspace = true, features = ["fido2-soft"] }
# The API bridge runtime is exercised end to end against the in-process server.
termoso-bridge = { workspace = true }
