[package]
name = "termoso-core"
description = "Termoso client core: encrypted local vault, sync, SSH/SFTP/PTY engines shared by desktop and mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
async-trait = "0.1"

# local storage
rusqlite = { version = "0.39", features = ["bundled"] }
keyring = { version = "4", optional = true }

# ssh / sftp / terminals
russh = { version = "0.63", features = ["rsa"] }
russh-sftp = "3"
portable-pty = { version = "0.9", optional = true }
serialport = { version = "4.9", default-features = false, optional = true }
encoding_rs = { version = "0.8", optional = true }
rand = "0.10"
# FIDO2 security keys (CTAP2 over USB HID).
ctap-hid-fido2 = { version = "3.5", optional = true }

# server api
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
hex = "0.4"
sha2 = { workspace = true }
hmac = "0.12"
quick-xml = "0.41"
dirs = "6"

[features]
default = ["keychain", "local-pty", "serial", "fido2"]
# Store the local master key in the OS keychain (Secret Service / Credential Manager / Keychain).
keychain = ["dep:keyring"]
# Local terminal (spawns the user's shell in a PTY).
local-pty = ["dep:portable-pty"]
# Serial console over a COM / tty device.
serial = ["dep:serialport", "dep:encoding_rs"]
# FIDO2 security keys (`sk-ssh-ed25519@openssh.com`, `sk-ecdsa-sha2-nistp256@openssh.com`).
fido2 = ["dep:ctap-hid-fido2"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
termoso-server = { path = "../termoso-server" }
axum = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
totp-rs = { workspace = true }
