[package]
name = "termoso-client"
description = "Termoso client façades shared by the desktop and mobile shells: host editor, keychain, typed errors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
termoso-core = { workspace = true }
termoso-proto = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["fido2"]
# FIDO2 security keys in the keychain (needs USB HID; off on Android).
fido2 = ["termoso-core/fido2"]


[dev-dependencies]
tempfile = "3"
