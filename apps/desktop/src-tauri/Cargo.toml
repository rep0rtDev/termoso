[package]
name = "termoso-desktop"
description = "Termoso desktop client (Tauri 2 shell over termoso-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "termoso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
termoso-core = { path = "../../../crates/termoso-core" }
termoso-client = { workspace = true, features = ["fido2"] }
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true }

tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }

tokio = { workspace = true }
tokio-util = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hostname = "0.4"
url = { workspace = true }
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-updater = "2.11"
dunce = "1"

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }
