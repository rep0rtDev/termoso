[package]
name = "termoso-desktop"
description = "Termoso desktop client (Tauri 2 shell over termoso-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "termoso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
termoso-core = { path = "../../../crates/termoso-core" }
termoso-crypto = { workspace = true }
termoso-proto = { workspace = true }

tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"

tokio = { workspace = true }
tokio-util = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
