org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Rust ABIs bundled into the AAR (comma-separated cargo-ndk targets).
# CI/release adds armeabi-v7a; emulators need x86_64.
termoso.abis=arm64-v8a,x86_64

# Server whose https://<host>/invite/… and /join/… links open directly in the app
# (Android App Links). Self-hosted builds: set your own host and publish this build's
# signing certificate via TERMOSO_ANDROID_APP_LINKS on that server.
termoso.appLinkHost=app.termoso.com
