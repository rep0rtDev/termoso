# Backing services for local development and the integration tests.
# NOT a production stack: fixed passwords, every port published on localhost,
# no TLS. Use docker-compose.yml (or deploy/quadlet/) to run a real server.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d --wait
#   cargo run -p termoso-server            # defaults match the addresses below
#   cargo test --workspace                 # picks these services up automatically
#   docker compose -f deploy/docker-compose.dev.yml down -v   # wipe data
#
# Services
#   postgres  localhost:5432   user/password/db: termoso/termoso/termoso
#   redis     localhost:6379
#   minio     localhost:9000   (console :9001)  minioadmin/minioadmin
#   mailpit   localhost:1025   SMTP sink; UI at http://localhost:8025
#
# Data lives in named volumes so it survives `down`/`up`; `down -v` resets it.

name: termoso-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: termoso
      POSTGRES_PASSWORD: termoso
      POSTGRES_DB: termoso
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termoso -d termoso"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  minio:
