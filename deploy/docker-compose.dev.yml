# Backing services only, for local development and integration tests:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   cargo run -p termoso-server            # uses the defaults below
#   cargo test --workspace                 # picks these services up automatically
#
# Mailpit catches every outgoing email (UI: http://localhost:8025).

name: termoso-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: termoso
      POSTGRES_PASSWORD: termoso
      POSTGRES_DB: termoso
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termoso -d termoso"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
