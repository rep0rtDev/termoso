# Termoso self-hosted stack: API + PostgreSQL + Redis + MinIO.
#
#   cp deploy/.env.example deploy/.env   # then edit TERMOSO_MASTER_KEY etc.
#   docker compose -f deploy/docker-compose.yml up -d
#
# Put a TLS-terminating reverse proxy (Caddy / Traefik / nginx) in front of
# `api` (port 8080) and `minio` (port 9000, for pre-signed log uploads).

name: termoso

services:
  api:
    image: ghcr.io/rep0rtdev/termoso-server:${TERMOSO_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TERMOSO_BIND: 0.0.0.0:8080
      TERMOSO_DATABASE_URL: postgres://termoso:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/termoso
      TERMOSO_REDIS_URL: redis://redis:6379
      TERMOSO_S3__ENDPOINT: http://minio:9000
      TERMOSO_S3__BUCKET: ${MINIO_BUCKET:-termoso-logs}
      TERMOSO_S3__ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      TERMOSO_S3__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      TERMOSO_S3__REGION: us-east-1
      TERMOSO_TRUST_PROXY: "true"
    ports:
      - "${TERMOSO_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/termoso-server", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: termoso
      POSTGRES_DB: termoso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termoso -d termoso"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres:
  redis:
  minio:
